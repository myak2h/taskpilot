services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot
      POSTGRES_DB: taskpilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://taskpilot:taskpilot@db:5432/taskpilot
      # Read from the root .env file or your shell; empty = offline demo mode
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]   # API docs at http://localhost:8000/docs
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]     # App at http://localhost:3000
    restart: unless-stopped

volumes:
  pgdata:
